<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders - Smart Store</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* ORDER CARD */
        .order-card {
            background: #fff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .order-card h5 {
            margin-bottom: 10px;
        }

        .order-items li {
            margin: 5px 0;
        }

        .status {
            font-weight: bold;
        }

        .status.placed { color: orange; }
        .status.shipped { color: blue; }
        .status.delivered { color: green; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2>My Orders 📦</h2>
    <div id="orders-container"></div>
</div>

<script src="./js/orders.js"></script>
</body>
</html>
