<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Store</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow">
    
    <!-- LOGO -->
    <a class="navbar-brand fw-bold" href="#">🛍 Smart Store</a>

    <!-- TOGGLE -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- NAV CONTENT -->
    <div class="collapse navbar-collapse" id="navbarContent">

        <!-- CENTER MENU -->
        <ul class="navbar-nav mx-auto">
            <li class="nav-item">
                <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="product.html">Products</a>
            </li>
        </ul>

        <!-- SEARCH -->
        <form class="d-flex me-3">
            <input class="form-control rounded-pill" type="search" placeholder="Search..." id="search" onkeyup="searchProducts()">
        </form>

        <!-- RIGHT SIDE -->
        <div id="nav-auth" class="d-flex gap-2"></div>

    </div>
</nav>

<!-- CAROUSEL -->
<div class="carousel-container">
    <img id="slide" src="https://via.placeholder.com/1200x300" class="w-100 rounded">
</div>


<!-- PRODUCTS -->
<section class="container mt-4">
    <h3>Latest Products</h3>
    <div id="latest-products" class="product-container"></div>
</section>

<!-- RECENT -->
<section class="container mt-4">
    <h3>Recently Viewed</h3>
    <div id="recent-products" class="product-container"></div>
</section>

<!-- FOOTER -->
<footer class="text-center mt-5 p-3 bg-dark text-white">
    © 2026 Smart Store | Contact: +91 XXXXXXXX
</footer>

<script src="./js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
